# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = false
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Mod Information
mod_version = 1.0.0
root_package = com.mahghuuuls.onlysomanyenchants
mod_id = onlysomanyenchants
mod_name = Only So Many Enchants

# Mod Metadata
mod_description = Enforces a single configurable limit on how many distinct enchantments any item or enchanted book can carry across loot, trading, enchanting, anvils, commands, mobs, and existing saves.
mod_url = https://github.com/mahghuuuls/only-so-many-enchants
mod_update_json =
mod_authors = mahghuuuls
mod_credits =
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = mahghuuuls
extra_jvm_args =
extra_tweak_classes =

# Publishing (disabled; owner publishes manually)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =
release_type = release
publish_with_changelog = false
client_side = true
server_side = true
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Source Modification
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins (build pin only; shipping metadata declares required-after:mixinbooter@[10.7,))
use_mixins = true
mixin_booter_version = 11.18
generate_mixins_json = false
mixin_package = ${root_package}.mixin
mixin_configs = mixins.${mod_id}.json
mixin_connector_class =
mixin_refmap = mixins.${mod_id}.refmap.json

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
